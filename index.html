<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GTA5-int</title>
    <style>
        body {
    margin: 0;
    padding: 20px;
    background-color: rgb(58, 75, 82); /* Цвет океана */
    display: flex;
    justify-content: center;
}

/* Фиксируем размеры строго по пикселям исходника, чтобы метки не ехали */
.map-container {
    position: relative;
    width: 684px;  
    height: 1017px; 
}

/* Картинка теперь жестко занимает 100% контейнера */
.map-image {
    width: 100%;
    height: 100%;
    display: block;
}

/* Общий стиль для всех меток */
.marker {
    position: absolute;
    width: 12px; /* Чуть уменьшил, чтобы попадать точнее */
    height: 13px;
    background-color: red;
    border: 2px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%); 
    cursor: pointer;
    z-index: 10;
}

/* Стиль для тыкв */
.marker.pumpkin {
    background-color: #ff8c00; 
    border: 2px solid #228b22; 
    box-shadow: 0 0 6px #ff8c00;
}

.marker::after {
    content: attr(data-title);
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    white-space: nowrap;
    display: none; 
    font-family: Arial, sans-serif;
    z-index: 20;
}

.marker:hover::after {
    display: block;
}

    </style>
</head>
<body>

    <!-- Контейнер с картой -->
    <div class="map-container">
        
        <!-- Картинка фона -->
        <img src="./map.jpg" alt="Карта" class="map-image">

</body>
</html>
