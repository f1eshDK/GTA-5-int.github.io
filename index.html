<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GTA5-int</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: rgb(58, 75, 82); /* Цвет океана */
            display: flex;
            justify-content: center;
        }

        /* Фиксируем размеры строго по пикселям исходника, чтобы метки не ехали */
        .map-container {
            position: relative;
            width: 684px;  
            height: 1017px; 
        }

        /* Картинка теперь жестко занимает 100% контейнера */
        .map-image {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Общий стиль для всех меток */
        .marker {
            position: absolute;
            width: 6px; /* Чуть уменьшил, чтобы попадать точнее */
            height: 6px;
            background-color: red;
            border: 1px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%); 
            cursor: pointer;
            z-index: 10;
        }

        /* Стиль для тыкв */
        .marker.pumpkin {
            background-color: #ff8c00; 
            border: 1px solid #228b22; 
            box-shadow: 0 0 3px #ff8c00;
        }

        /* Обновленный стиль всплывающего окна с текстом */
        .marker::after {
            content: attr(data-title);
            position: absolute;
            bottom: 25px; /* Чуть приподняли над меткой */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.95); /* Темный стильный фон */
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            font-family: Arial, sans-serif;
            white-space: pre-line; /* Позволяет переносить текст на новую строку */
            display: none; 
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #ff8c00; /* Оранжевая рамка под стиль Хэллоуина */
            text-align: center;
        }

        /* Показываем ТЕКСТОВУЮ подсказку только при наведении (hover), если скриншот не открыт */
        .marker:hover::after {
            display: block;
        }
        /* Если скриншот открыт, скрываем текстовую подсказку, чтобы она не мешала */
        .marker.show-screenshot:hover::after {
            display: none;
        }

        /* Базовый стиль скрытого скриншота */
        .marker img {
            display: none;
            position: absolute;
            bottom: 25px; /* Отображаем строго над тыквой */
            left: 50%;
            transform: translateX(-50%);
            width: 220px; /* Оптимальный размер для скриншота */
            height: auto;
            border: 2px solid #ff8c00;
            border-radius: 6px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.7);
            z-index: 100;
            pointer-events: none; /* Чтобы картинка не мешала кликать по карте */
        }

        /* Класс, который JavaScript будет добавлять для показа скриншота */
        .marker.show-screenshot img {
            display: block;
            animation: fadeIn 0.2s ease-in-out;
        }

        /* Плавное появление */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(5px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ИСПРАВЛЕНО: Свойство opacity применяется только к фону и рамке самой точки */
        .marker.pumpkin.collected {
            background-color: rgba(102, 102, 102, 0.5); /* Серый цвет с прозрачностью 50% */
            border: 1px solid rgba(153, 153, 153, 0.5); /* Серая рамка с прозрачностью 50% */
            box-shadow: none;                            /* Выключаем оранжевое свечение */
        }

/* Принудительно возвращаем скриншоту внутри собранной тыквы 100% яркость */
.marker.pumpkin.collected img {
    opacity: 1 !important;
    filter: none !important;
}


    </style>

<script>
    const container = document.querySelector('.map-container');
    let scale = 1;

    // Приближение/отдаление на колесико мыши удерживая Ctrl (или просто при прокрутке)
    window.addEventListener('wheel', (e) => {
        e.preventDefault();
        
        // Меняем масштаб контейнера
        if (e.deltaY < 0) {
            scale = Math.min(scale + 0.1, 4); // Макс зум в 4 раза
        } else {
            scale = Math.max(scale - 0.1, 1); // Мин зум — исходный
        }
        
        container.style.transform = `scale(${scale})`;
        container.style.transformOrigin = `${e.offsetX}px ${e.offsetY}px`;

        // Важная магия: уменьшаем сами маркеры во столько же раз, во сколько увеличили карту!
        document.querySelectorAll('.marker').forEach(marker => {
            marker.style.transform = `translate(-50%, -50%) scale(${1 / scale})`;
        });
    }, { passive: false });
</script>

<script>
    const mapContainer = document.querySelector('.map-container');

    // Находим все тыквы на карте и присваиваем им ID автоматически по порядку,
    // если вы забыли прописать их вручную в HTML (например: p1, p2, p3...)
    document.querySelectorAll('.marker.pumpkin').forEach((marker, index) => {
        if (!marker.id) {
            marker.id = 'p' + (index + 1);
        }
        
        // Проверяем память браузера: если эта тыква200 была собрана ранее, делаем её серой
        if (localStorage.getItem(marker.id) === 'collected') {
            marker.classList.add('collected');
        }
    });

    // ОБРАБОТКА КЛИКОВ
    mapContainer.addEventListener('click', (event) => {
        const clickedMarker = event.target.closest('.marker.pumpkin');

        if (clickedMarker) {
            event.stopPropagation(); 
            
            // Если кликнули по самой картинке скриншота внутри тултипа — ничего не делаем
            if (event.target.tagName === 'IMG') return;

            // ЛОГИКА СБОРА ТЫКВЫ: переключаем серый класс (собрано / не собрано)
            // Игрок кликает по точке — она становится серой. Кликает еще раз — снова оранжевой.
            if (clickedMarker.classList.contains('collected')) {
                clickedMarker.classList.remove('collected');
                localStorage.removeItem(clickedMarker.id); // Удаляем из памяти
            } else {
                clickedMarker.classList.add('collected');
                localStorage.setItem(clickedMarker.id, 'collected'); // Сохраняем в память
            }

            // ЛОГИКА ДЛЯ ИГРОКА: Показ скриншота при клике
            if (clickedMarker.classList.contains('show-screenshot')) {
                clickedMarker.classList.remove('show-screenshot');
            } else {
                document.querySelectorAll('.marker.pumpkin').forEach(m => m.classList.remove('show-screenshot'));
                clickedMarker.classList.add('show-screenshot');
            }

        } else {
            // ЛОГИКА ДЛЯ РАЗРАБОТЧИКА: Клик мимо — выдаем проценты координат в консоль (F12)
            const rect = mapContainer.getBoundingClientRect();
            const left = ((event.clientX - rect.left) / rect.width * 100).toFixed(1);
            const top = ((event.clientY - rect.top) / rect.height * 100).toFixed(1);
            
            console.log(`<div class="marker pumpkin" style="left: ${left}%; top: ${top}%;" data-title="Тыква 201></div>`);

            // Закрываем скриншоты при клике на пустое место карты
            document.querySelectorAll('.marker.pumpkin').forEach(marker => {
                marker.classList.remove('show-screenshot');
            });
        }
    });
</script>
